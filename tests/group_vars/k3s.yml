---

k3s_iface: '{{ ethernet_interface_name }}'
k3s_api_port: 6443
k3s_cluster_cidr: 10.52.0.0/16
# Must sit on the subnet the Vagrantfile actually creates (192.168.56.11-13).
# This was 192.168.11.150-170, so cilium announced an L2 pool onto a subnet
# that does not exist in the harness.
k3s_lb_ip_range: 192.168.56.150-192.168.56.170

# Core cluster only. See playbooks/vars/main.yml for why.
k3s_apps_enabled: false

k3s_version: v1.36.3+k3s1 # https://github.com/k3s-io/k3s/releases

kube_vip_version: v1.2.3 # https://github.com/kube-vip/kube-vip/releases
kube_vip_api_address: 192.168.56.250

cilium_version: 1.20.1 # https://github.com/cilium/cilium/releases

reflector_version: 10.0.65 # https://github.com/emberstack/kubernetes-reflector/releases

gateway_api_version: v1.6.1 # https://github.com/kubernetes-sigs/gateway-api/releases

k3s_controller_config:
  address: localhost
  path: "{{ lookup('env', 'HOME') }}/.kube"
  name: config
  owner: "{{ lookup('env', 'USER') }}"
  group: staff

dns_config:
  domain: test.lab
  email: test@gmail.com
  upstream:
    - 8.8.4.4
    - 8.8.8.8
