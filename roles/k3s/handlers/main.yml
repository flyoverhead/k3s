---

- name: k3s | start
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: k3s.service
    state: started

- name: k3s | restart
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: k3s.service
    state: restarted

- name: node | reboot
  become: true
  ansible.builtin.reboot:
