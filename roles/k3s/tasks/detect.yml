---

- name: detect | services
  ansible.builtin.service_facts:

- name: detect | set k3s_arch fact
  ansible.builtin.set_fact:
    k3s_arch: >-
      {{ 'amd64' if
      ansible_facts.architecture in ['x86_64', 'amd64'] else
      'arm64' if
      ansible_facts.architecture in ['aarch64', 'arm64'] }}

- name: detect | set k3s_binary fact
  ansible.builtin.set_fact:
    k3s_binary: >-
      {{ 'k3s' if
      ansible_facts.architecture in ['x86_64', 'amd64'] else
      'k3s-arm64' if
      ansible_facts.architecture in ['aarch64', 'arm64'] }}

- name: detect | set k3s_installed fact
  ansible.builtin.set_fact:
    k3s_installed: >-
      {{ true if
      'k3s.service' in ansible_facts.services
      else false }}

- name: detect | get k3s installed version
  ansible.builtin.command:
    k3s --version
  register: k3s_version_info
  changed_when: false
  # ansible.builtin.command declares no check mode support, so a check run
  # skips it and the set_fact below aborts on stdout_lines. It only reads a
  # version.
  check_mode: false
  when:
    - k3s_installed

- name: detect | set k3s_install_version fact
  ansible.builtin.set_fact:
    k3s_install_version: >-
      {{ k3s_version | regex_search('(\d+\.\d+\.\d+)') }}

- name: detect | set k3s_installed_version fact
  ansible.builtin.set_fact:
    k3s_installed_version: >-
      {{ k3s_version_info.stdout_lines | first |
      regex_search('(\d+\.\d+\.\d+)') }}
  when:
    - k3s_installed

- name: detect | set k3s_update fact
  ansible.builtin.set_fact:
    k3s_update: >-
      {{ true if
      k3s_installed and
      k3s_install_version is version(k3s_installed_version |
      default(k3s_install_version), '>')
      else false }}

- name: detect | network settings
  block:

    - name: detect | node ip
      ansible.builtin.set_fact:
        k3s_node_ip: "{{ ansible_facts[k3s_config.iface]['ipv4']['address'] }}"

    - name: detect | api endpoint
      ansible.builtin.set_fact:
        k3s_api_endpoint: >-
          {{ k3s_kube_vip_config.api_address if
          groups[k3s_server_group] | length > 1 else
          hostvars[groups[k3s_server_group][0]].ansible_facts[k3s_config.iface]['ipv4']['address'] }}

- name: detect | cluster info
  become: true
  become_user: '{{ k3s_controller_config.owner }}'
  delegate_to: '{{ k3s_controller_config.address }}'
  run_once: true
  block:

    - name: detect | check if cluster is configured
      kubernetes.core.k8s_cluster_info:
        kubeconfig: '{{ k3s_controller_config.path }}/{{ k3s_controller_config.name }}'
        validate_certs: false
      register: k3s_cluster_info
      failed_when: false

    - name: detect | set k3s_cluster_configured fact
      ansible.builtin.set_fact:
        k3s_cluster_configured: >-
          {{ true if
          k3s_cluster_info.connection.host | default('') | length > 0
          else false }}

    - name: detect | check if node is already joined
      kubernetes.core.k8s_info:
        kind: Node
        name: '{{ inventory_hostname }}'
        namespace: kube-system
        kubeconfig: '{{ k3s_controller_config.path }}/{{ k3s_controller_config.name }}'
        validate_certs: false
      register: k3s_node_info
      when:
        - k3s_cluster_configured

    - name: detect | set k3s_node_joined fact
      ansible.builtin.set_fact:
        k3s_node_joined: >-
          {{ true if
          k3s_node_info.resources | default([]) | length > 0
          else false }}

- name: detect | cluster token
  become: true
  delegate_to: '{{ groups[k3s_server_group][0] }}'
  run_once: true
  when:
    - k3s_cluster_configured
  block:

    - name: detect | read node-token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/token
      register: k3s_node_token

    - name: detect | set k3s_token fact
      ansible.builtin.set_fact:
        k3s_token: '{{ k3s_node_token.content | b64decode | trim }}'

- name: detect | set k3s_cluster_size fact
  ansible.builtin.set_fact:
    k3s_cluster_size: >-
      {{ (groups[k3s_server_group] | default([]) | length) +
      (groups[k3s_agent_group] | default([]) | length) }}
