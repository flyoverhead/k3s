---

- name: config | node
  when:
    - not k3s_node_joined
  block:

    - name: config | create config directory
      become: true
      ansible.builtin.file:
        dest: /etc/rancher/k3s
        owner: root
        group: root
        mode: '0755'
        state: directory

    - name: config | create config file
      become: true
      ansible.builtin.template:
        src: config.j2
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: '0644'

    - name: config | create service file
      become: true
      ansible.builtin.template:
        src: k3s.service.j2
        dest: /etc/systemd/system/k3s.service
        owner: root
        group: root
        mode: '0640'
      notify:
        - k3s | start

    - name: config | start k3s service
      ansible.builtin.meta:
        flush_handlers

- name: config | get cluster config
  when:
    - not k3s_cluster_configured
  block:

    - name: config | wait for k3s.yaml to be created
      ansible.builtin.wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        state: present

    - name: config | get k3s.yaml file content
      become: true
      delegate_to: '{{ groups[k3s_server_group][0] }}'
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_config_file

    - name: config | save cluster config locally
      become: true
      become_user: '{{ k3s_controller_config.owner }}'
      delegate_to: '{{ k3s_controller_config.address }}'
      block:

        - name: config | create local kube directory
          ansible.builtin.file:
            path: '{{ k3s_controller_config.path }}'
            group: '{{ k3s_controller_config.group }}'
            owner: '{{ k3s_controller_config.owner }}'
            mode: '0750'
            state: directory

        - name: config | save cluster config locally
          ansible.builtin.copy:
            content: '{{ k3s_config_file.content | b64decode }}'
            dest: '{{ k3s_controller_config.path }}/{{ k3s_controller_config.name }}'
            group: '{{ k3s_controller_config.group }}'
            owner: '{{ k3s_controller_config.owner }}'
            mode: '0600'

        - name: config | add api endpoint to local config
          ansible.builtin.lineinfile:
            path: '{{ k3s_controller_config.path }}/{{ k3s_controller_config.name }}'
            regexp: ^\s{4}server:\shttps:\/\/(\d+\.\d+\.\d+\.\d+)
            line: '    server: https://{{ k3s_node_ip }}:{{ k3s_config.api_port }}'
            group: '{{ k3s_controller_config.group }}'
            owner: '{{ k3s_controller_config.owner }}'
            mode: '0600'

        - name: config | check for cluster api is up
          kubernetes.core.k8s_cluster_info:
            kubeconfig: '{{ k3s_controller_config.path }}/{{ k3s_controller_config.name }}'
            validate_certs: false
          register: k3s_cluster_api
          until: k3s_cluster_api.connection.host | default('') | length > 0

- name: config | master controller
  become: true
  become_user: '{{ k3s_controller_config.owner }}'
  delegate_to: '{{ k3s_controller_config.address }}'
  run_once: true
  when:
    - inventory_hostname == groups[k3s_server_group][0]
    - not k3s_cluster_configured
  block:

    - name: config | kube-vip
      when:
        - groups[k3s_server_group] | length > 1
      block:

        - name: config | kube-vip resources
          ansible.builtin.include_role:
            name: resource
          vars:
            resources_definition: '{{ kube_vip_resources }}'

        - name: config | change local config to kube-vip api endpoint
          ansible.builtin.lineinfile:
            path: '{{ k3s_controller_config.path }}/{{ k3s_controller_config.name }}'
            regexp: ^\s{4}server:\shttps:\/\/(\d+\.\d+\.\d+\.\d+)
            line: '    server: https://{{ k3s_api_endpoint }}:{{ k3s_config.api_port }}'
            group: '{{ k3s_controller_config.group }}'
            owner: '{{ k3s_controller_config.owner }}'
            mode: '0600'

        - name: config | check kube-vip api endpoint
          kubernetes.core.k8s_cluster_info:
            kubeconfig: '{{ k3s_controller_config.path }}/{{ k3s_controller_config.name }}'
            validate_certs: false
          register: k3s_cluster_api
          until: k3s_cluster_api.connection.host | default('') | length > 0

- name: config | wait for node is up and running
  become: false
  delegate_to: localhost
  kubernetes.core.k8s_info:
    kind: Node
    name: '{{ inventory_hostname }}'
    namespace: kube-system
    wait: true
    wait_condition:
      reason: KubeletReady
      type: Ready
      status: true
    wait_timeout: 180
    kubeconfig: '{{ k3s_controller_config.path }}/{{ k3s_controller_config.name }}'
    validate_certs: false
  when:
    - not k3s_node_joined
