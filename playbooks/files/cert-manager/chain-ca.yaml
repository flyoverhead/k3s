apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: chain-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: chain-ca
  secretName: chain-ca-secret
  duration: 43800h
  renewBefore: 35040h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: root-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: chain-ca-issuer
  namespace: cert-manager
spec:
  ca:
    secretName: chain-ca-secret
